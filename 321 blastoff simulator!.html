// ── INTERPOLATE + RENDER OTHER PLAYERS each frame ───────────────────────────
function updateOtherPlayers(){
  if(!otherPlayers || typeof camera === 'undefined') return;
  const entries = Object.values(otherPlayers);
  if(!entries.length) return;
  const camFrustum = new THREE.Frustum();
  camFrustum.setFromProjectionMatrix(
    new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)
  );
  entries.forEach(op => {
    if(!op || !op.data || !op.mesh || !op.nameTag) return;
    const d = op.data;
    op.mesh.position.lerp(new THREE.Vector3(d.x||0, d.y||0, d.z||0), 0.25);
    op.mesh.rotation.y += ((d.rotY||0) - op.mesh.rotation.y) * 0.25;
    const headPos = op.mesh.position.clone();
    headPos.y += 3.5;
    const screen = projectToScreen(headPos);
    if(screen.behind || screen.x < 0 || screen.x > window.innerWidth){
      op.nameTag.style.display='none';
    } else {
      op.nameTag.style.display='block';
      op.nameTag.style.left = screen.x+'px';
      op.nameTag.style.top  = screen.y+'px';
    }
  });
}

// ── ADMIN FUNCTIONS ──────────────────────────────────────────────────────────
function adminLogin(){
  if(!socket || !socket.connected){
    document.getElementById('apLoginStatus').textContent='Not connected to server.';
    return;
  }
  const pw = document.getElementById('apPasswordInput').value;
  socket.emit('adminLogin', pw);
  document.getElementById('apPasswordInput').value='';
}

function updateAdminPlayerList(){
  const container = document.getElementById('apPlayerList');
  if(!container) return;
  container.innerHTML = '';
  const ids = Object.keys(otherPlayers || {});
  if(!ids.length){
    container.innerHTML = '<div style="color:#555;font-size:12px;text-align:center;padding:8px">No other players online</div>';
    return;
  }
  ids.forEach(id => {
    const op = otherPlayers[id];
    if(!op) return;
    const name = (op.nameTag && op.nameTag.textContent) || (op.data && op.data.name) || 'Player';
    const card = document.createElement('div');
    card.className = 'ap-player-card';
    card.innerHTML = `
      <span class="ap-player-name">${name}</span>
      <div class="ap-player-btns">
        <button class="ap-fling-btn" onclick="adminCmd('fling','${id}')">⚡ Fling</button>
        <button class="ap-kick-btn"  onclick="adminCmd('kick','${id}')">🚫 Kick</button>
      </div>`;
    container.appendChild(card);
  });
}

function adminCmd(action, targetId){
  if(!socket || !socket.connected){
    const status = document.getElementById('apCmdStatus');
    if(status){ status.style.color='#ff4444'; status.textContent='⚠ Not connected to server'; }
    return;
  }
  // Make sure server knows we're admin before sending command
  if(!isAdminVerified){
    socket.emit('adminLogin', AP_CODE);
  }
  socket.emit('adminCmd', { action, targetId });
  const status = document.getElementById('apCmdStatus');
  if(status){ status.style.color='#ffcc44'; status.textContent=`⏳ Sending ${action}...`; }
}

function buildSaveData(){
  return {
    v:1, cash, gems, fuel, playerRank, rankCashMultiplier,
    currentRocketTier, currentScoopIndex, currentPackIndex, maxFuel,
    gemItems: gemShopItems.map(i=>({id:i.id,owned:!!i.owned,count:i.count||0})),
    chests:{
      sky:skyChestCollected, float:chestCollected, cloud:cloudChestCollected,
      sat:satChestCollected, ss:ssChestCollected, fs:fsChestCollected,
      ml:mlChestCollected, sr:srChestCollected, bm:bmChestCollected,
      dm:dmChestCollected, cannon:cannonChestCollected, ufo:ufoChestCollected,
      sp:spChestCollected, sca:scaChestCollected
    }
  };
}

function applySaveData(d){
  cash=d.cash||0; gems=d.gems||0;
  playerRank=d.playerRank||0; rankCashMultiplier=d.rankCashMultiplier||1;
  maxFuel=d.maxFuel||100; fuel=Math.min(d.fuel||0,maxFuel);
  currentPackIndex=d.currentPackIndex||0;
  applyRocketTier(Math.min(d.currentRocketTier||0,rocketTiers.length-1));
  const si=Math.min(d.currentScoopIndex||0,scoopTiers.length-1);
  currentScoopIndex=si; scoopRate=scoopTiers[si].rate; applyScoopVisuals(si);
  if(d.gemItems) d.gemItems.forEach(s=>{
    const it=gemShopItems.find(x=>x.id===s.id); if(!it) return;
    if(s.owned&&!it.owned){it.owned=true;it.onBuy&&it.onBuy();}
    if(typeof s.count==='number') it.count=s.count;
  });
  const c=d.chests||{};
  skyChestCollected=!!c.sky; chestCollected=!!c.float; cloudChestCollected=!!c.cloud;
  satChestCollected=!!c.sat; ssChestCollected=!!c.ss; fsChestCollected=!!c.fs;
  mlChestCollected=!!c.ml; srChestCollected=!!c.sr; bmChestCollected=!!c.bm;
  dmChestCollected=!!c.dm; cannonChestCollected=!!c.cannon; ufoChestCollected=!!c.ufo;
  spChestCollected=!!c.sp; scaChestCollected=!!c.sca;
}

function genCode(){ let c=''; for(let i=0;i<10;i++) c+=Math.floor(Math.random()*10); return c; }

function generateSave(){
  const code=genCode();
  localStorage.setItem('blastoff_'+code, JSON.stringify(buildSaveData()));
  document.getElementById('suCode').textContent=code;
  setSaveStatus('✓ Saved! Write down your code.','#44ff88');
}

function loadSave(){
  const code=(document.getElementById('suLoadInput').value||'').trim();
  if(!/^\d{10}$/.test(code)){setSaveStatus('✗ Must be exactly 10 digits.','#ff4444');return;}
  const raw=localStorage.getItem('blastoff_'+code);
  if(!raw){setSaveStatus('✗ No save found for that code.','#ff4444');return;}
  try{ applySaveData(JSON.parse(raw)); setSaveStatus('✓ Loaded!','#44ff88'); setTimeout(closeSaveUI,1200); }
  catch(e){ setSaveStatus('✗ Save data corrupted.','#ff4444'); }
}

function copySaveCode(){
  const t=document.getElementById('suCode').textContent;
  if(t.includes('—')) return;
  navigator.clipboard.writeText(t).then(()=>setSaveStatus('📋 Copied!','#aaccff')).catch(()=>{});
}

function setSaveStatus(msg,col){

}

// ── CHAT SYSTEM ──────────────────────────────────────────────────────────────
let chatOpen = false;
const chatMessages = document.getElementById('chatMessages');
const chatInputRow = document.getElementById('chatInputRow');
const chatInput    = document.getElementById('chatInput');
const MAX_CHAT_MSGS = 30;
let chatFadeTimers = [];

function addChatMessage(sender, text, type){
  const div = document.createElement('div');
  div.className = 'chat-msg' + (type ? ' '+type : '');
  div.innerHTML = sender
    ? `<b style="color:${type==='self'?'#88ff88':type==='admin'?'#ff8844':'#88aaff'}">${sender}:</b> ${text}`
    : text;
  chatMessages.appendChild(div);
  // Keep max messages
  while(chatMessages.children.length > MAX_CHAT_MSGS){
    chatMessages.removeChild(chatMessages.firstChild);
  }
  chatMessages.scrollTop = chatMessages.scrollHeight;
  // Auto-fade after 8 seconds if chat is closed
  const timer = setTimeout(()=>{
    if(!chatOpen) div.style.opacity = '0';
    div.style.transition = 'opacity 1s';
  }, 8000);
  chatFadeTimers.push(timer);
}

function openChat(){
  chatOpen = true;
  chatInputRow.style.display = 'block';
  chatInput.focus();
  // Restore all message opacity
  Array.from(chatMessages.children).forEach(m => { m.style.opacity='1'; });
  chatFadeTimers.forEach(t => clearTimeout(t));
  chatFadeTimers = [];
  // Block game keys while typing
  keys = {};
}

function closeChat(){
  chatOpen = false;
  chatInputRow.style.display = 'none';
  chatInput.value = '';
  chatInput.blur();
}

function sendChat(){
  const text = chatInput.value.trim();
  if(!text) return;
  if(socket && socket.connected){
    socket.emit('chatMsg', { text });
  }
  // Show immediately to self
  addChatMessage(myName, text, 'self');
  chatInput.value = '';
  closeChat();
}

// T opens chat (override the turbo boost T key when chat is open)
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && chatOpen){ sendChat(); return; }
  if(e.key === 'Escape' && chatOpen){ closeChat(); return; }
  if(chatOpen) return; // eat all keys while typing
  if(e.key.toLowerCase() === 't' &&
     document.getElementById('nameOverlay').style.display === 'none'){
    e.preventDefault();
    openChat();
  }
});

// Receive chat from server
function initChat(){
  if(!socket) return;
  socket.on('chatMsg', data => {
    if(data.id === myId) return; // already shown to self
    const isAdmin = data.isAdmin;
    addChatMessage(data.name, data.text, isAdmin ? 'admin' : '');
  });
}
